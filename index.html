let firestoreApi = null;
async function getFirestoreApi() {
  if (!FIREBASE_ENABLED) return null;
  if (firestoreApi) return firestoreApi;
  const { initializeApp, getApps, getApp } = await import(
    `https://www.gstatic.com/firebasejs/${FIREBASE_SDK_VERSION}/firebase-app.js`
  );
  const {
    getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, query, orderBy,
  } = await import(

  );

  const db = getFirestore(app);
  firestoreApi = { db, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, query, orderBy };
  return firestoreApi;
}

let authApi = null;
async function getAuthApi() {
  if (!FIREBASE_ENABLED) return null;
  if (authApi) return authApi;
  const { initializeApp, getApps, getApp } = await import(
    `https://www.gstatic.com/firebasejs/${FIREBASE_SDK_VERSION}/firebase-app.js`
  );

    `https://www.gstatic.com/firebasejs/${FIREBASE_SDK_VERSION}/firebase-auth.js`
  );

  const auth = getAuth(app);
  authApi = { auth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut };
  return authApi;
}

function findActiveTenant(tenants, propertyId, date) {
  const candidates = tenants.filter((t) => t.propertyId === propertyId && t.leaseStart <= date && (!t.leaseEnd || t.leaseEnd >= date));
  if (candidates.length === 0) return null;
  return candidates.sort((a, b) => (a.leaseStart < b.leaseStart ? 1 : -1))[0];
}
function daysBetweenInclusive(isoStart, isoEnd) {
  const d1 = new Date(isoStart + "T00:00:00Z");
  const d2 = new Date(isoEnd + "T00:00:00Z");
  return Math.round((d2 - d1) / 86400000) + 1;
}
function maxISO(a, b) { return a > b ? a : b; }
function minISO(a, b) { return a < b ? a : b; }

/* ============================================================================
 * UTILITAIRES
 * ==========================================================================*/
const CSV_SEPARATOR = ";";
const DECIMAL_SEPARATOR = ",";
const DATE_FORMAT = "DD/MM/YYYY";

function uid() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }
function formatCurrency(n) {
  return new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 2 }).format(n || 0);
}
function formatDateForDisplay(iso) { const [y, m, d] = iso.split("-"); return `${d}/${m}/${y}`; }
function formatDateForCSV(iso) {
  if (DATE_FORMAT === "YYYY-MM-DD") return iso;
  const [y, m, d] = iso.split("-"); return `${d}/${m}/${y}`;
}
function formatAmountForCSV(n) {
  const fixed = Math.abs(n).toFixed(2);
  return DECIMAL_SEPARATOR === "," ? fixed.replace(".", ",") : fixed;
}
function buildCSV(transactions, propertiesById) {
  const header = ["Date","Propriete","RegimeFiscal","CategorieFiscale","Libelle","Montant","TypeOperation"].join(CSV_SEPARATOR);
  const rows = transactions.map((t) => {
    const property = propertiesById[t.propertyId];
    const signed = t.typeOperation === "Recette" ? t.montant : -t.montant;
    const cells = [
      formatDateForCSV(t.date),
      property ? property.name : "",
      property ? REGIMES[property.regime].label : "",
      t.categorie,
      t.libelle || "",
      (signed < 0 ? "-" : "") + formatAmountForCSV(signed),
      t.typeOperation,
    ];
    return cells.map((c) => (String(c).includes(CSV_SEPARATOR) ? `"${c}"` : c)).join(CSV_SEPARATOR);
  });
  return [header, ...rows].join("\r\n");
}
function downloadCSV(content, filename) {
  const blob = new Blob(["\uFEFF" + content], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url; link.setAttribute("download", filename);
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

/* ============================================================================
 * PERSISTANCE — Firestore si configuré, sinon localStorage
 * ==========================================================================*/
function useLedgerStore() {
  const readLocal = (key, fallback) => {
    try { const raw = window.localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
    catch { return fallback; }
  };
  const [properties, setProperties] = useState(() => readLocal("rel_properties", []));
  const [tenants, setTenants] = useState(() => readLocal("rel_tenants", []));
  const [transactions, setTransactions] = useState(() => readLocal("rel_transactions", []));
  const [ready, setReady] = useState(!FIREBASE_ENABLED);

  useEffect(() => {
    if (!FIREBASE_ENABLED) return;
    let unsubProps = () => {}; let unsubTenants = () => {}; let unsubTx = () => {};
    (async () => {
      const api = await getFirestoreApi();
      const propsQuery = api.query(api.collection(api.db, "properties"));
      unsubProps = api.onSnapshot(propsQuery, (snap) => setProperties(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
      const tenantsQuery = api.query(api.collection(api.db, "tenants"));
      unsubTenants = api.onSnapshot(tenantsQuery, (snap) => setTenants(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
      const txQuery = api.query(api.collection(api.db, "transactions"), api.orderBy("date", "desc"));
      unsubTx = api.onSnapshot(txQuery, (snap) => setTransactions(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
      setReady(true);
    })();
    return () => { unsubProps(); unsubTenants(); unsubTx(); };
  }, []);

  useEffect(() => { if (!FIREBASE_ENABLED) window.localStorage.setItem("rel_properties", JSON.stringify(properties)); }, [properties]);
  useEffect(() => { if (!FIREBASE_ENABLED) window.localStorage.setItem("rel_tenants", JSON.stringify(tenants)); }, [tenants]);
  useEffect(() => { if (!FIREBASE_ENABLED) window.localStorage.setItem("rel_transactions", JSON.stringify(transactions)); }, [transactions]);

  const addProperty = useCallback(async (property) => {
    if (FIREBASE_ENABLED) { const api = await getFirestoreApi(); await api.addDoc(api.collection(api.db, "properties"), property); }
    else setProperties((prev) => [...prev, { id: uid(), ...property }]);
  }, []);
  const updateProperty = useCallback(async (id, patch) => {
    if (FIREBASE_ENABLED) { const api = await getFirestoreApi(); await api.updateDoc(api.doc(api.db, "properties", id), patch); }
    else setProperties((prev) => prev.map((p) => (p.id === id ? { ...p, ...patch } : p)));
  }, []);
  const deleteProperty = useCallback(async (id) => {
    if (FIREBASE_ENABLED) { const api = await getFirestoreApi(); await api.deleteDoc(api.doc(api.db, "properties", id)); }
    else setProperties((prev) => prev.filter((p) => p.id !== id));
  }, []);
  const addTenant = useCallback(async (tenant) => {
    if (FIREBASE_ENABLED) { const api = await getFirestoreApi(); await api.addDoc(api.collection(api.db, "tenants"), tenant); }
    else setTenants((prev) => [...prev, { id: uid(), ...tenant }]);
  }, []);
  const updateTenant = useCallback(async (id, patch) => {
    if (FIREBASE_ENABLED) { const api = await getFirestoreApi(); await api.updateDoc(api.doc(api.db, "tenants", id), patch); }
    else setTenants((prev) => prev.map((t) => (t.id === id ? { ...t, ...patch } : t)));
  }, []);
  const deleteTenant = useCallback(async (id) => {
    if (FIREBASE_ENABLED) { const api = await getFirestoreApi(); await api.deleteDoc(api.doc(api.db, "tenants", id)); }
    else setTenants((prev) => prev.filter((t) => t.id !== id));
  }, []);
  const addTransactions = useCallback(async (list) => {
    if (FIREBASE_ENABLED) { const api = await getFirestoreApi(); await Promise.all(list.map((t) => api.addDoc(api.collection(api.db, "transactions"), t))); }
    else setTransactions((prev) => [...list.map((t) => ({ id: uid(), ...t })), ...prev]);
  }, []);
  const deleteTransaction = useCallback(async (id) => {
    if (FIREBASE_ENABLED) { const api = await getFirestoreApi(); await api.deleteDoc(api.doc(api.db, "transactions", id)); }
    else setTransactions((prev) => prev.filter((t) => t.id !== id));
  }, []);
  const deleteTransactionGroup = useCallback(async (groupId) => {
    const toRemove = transactions.filter((t) => t.groupId === groupId);
    await Promise.all(toRemove.map((t) => deleteTransaction(t.id)));
  }, [transactions, deleteTransaction]);

  return { ready, properties, tenants, transactions, addProperty, updateProperty, deleteProperty, addTenant, updateTenant, deleteTenant, addTransactions, deleteTransaction, deleteTransactionGroup };
}

/* ============================================================================
 * GESTION DES BIENS
 * ==========================================================================*/
function PropertyManagerModal({ open, onClose, properties, onAdd, onUpdate, onDelete }) {
  const [name, setName] = useState("");
  const [regime, setRegime] = useState("LMNP");
  const [editingId, setEditingId] = useState(null);

  function resetForm() { setName(""); setRegime("LMNP"); setEditingId(null); }
  function startEdit(p) { setEditingId(p.id); setName(p.name); setRegime(p.regime); }
  async function submit(e) {
    e.preventDefault();
    if (!name.trim()) return;
    if (editingId) await onUpdate(editingId, { name: name.trim(), regime });
    else await onAdd({ name: name.trim(), regime });
    resetForm();
  }

  return (
    <Modal open={open} onClose={onClose} title="Mes biens" wide>
      <form onSubmit={submit} className="mb-6 flex flex-wrap items-end gap-3">
        <div className="min-w-[200px] flex-1">
          <Field label="Nom du bien">
            <input className={inputClasses} value={name} onChange={(e) => setName(e.target.value)} placeholder="Ex. LMNP Studio Nantes" />
          </Field>
        </div>
        <div className="w-48">
          <Field label="Régime fiscal">
            <select className={inputClasses} value={regime} onChange={(e) => setRegime(e.target.value)}>
              {Object.values(REGIMES).map((r) => <option key={r.id} value={r.id}>{r.label}</option>)}
            </select>
          </Field>
        </div>
        <button type="submit" className="rounded-lg bg-[#20211D] px-4 py-2 text-sm font-medium text-[#F7F5EC] hover:bg-[#3A3B33]">
          {editingId ? "Enregistrer" : "Ajouter"}
        </button>
        {editingId && <button type="button" onClick={resetForm} className="rounded-lg border border-[#D6D2C0] px-4 py-2 text-sm text-[#5B5849]">Annuler</button>}
      </form>
      <div className="space-y-2">
        {properties.length === 0 && <p className="text-sm text-[#8A876F]">Aucun bien enregistré pour l'instant.</p>}
        {properties.map((p) => {
          const accent = REGIME_ACCENT[p.regime];
          return (
            <div key={p.id} className="flex items-center justify-between rounded-lg border border-[#DEDAC9] bg-white px-4 py-3">
              <div className="flex items-center gap-3">
                <span className={`rounded-full px-2 py-0.5 text-xs ${accent.bg} ${accent.text}`}>{REGIMES[p.regime].label}</span>
                <span className="text-[#20211D]">{p.name}</span>
              </div>
              <div className="flex items-center gap-1">
                <button onClick={() => startEdit(p)} className="rounded-md p-1.5 text-[#6B6858] hover:bg-[#EAE7D9]" aria-label="Modifier"><Pencil size={15} /></button>
                <button onClick={() => onDelete(p.id)} className="rounded-md p-1.5 text-[#A2432A] hover:bg-[#F3E2DC]" aria-label="Supprimer"><Trash2 size={15} /></button>
              </div>

}

/* ============================================================================
 * GESTION DES LOCATAIRES
 * ==========================================================================*/
function TenantManagerModal({ open, onClose, tenants, properties, transactions, onAdd, onUpdate, onDelete }) {
  const [name, setName] = useState("");
  const [propertyId, setPropertyId] = useState(properties[0]?.id || "");
  const [leaseStart, setLeaseStart] = useState("");
  const [leaseEnd, setLeaseEnd] = useState("");
  const [ongoing, setOngoing] = useState(true);
  const [editingId, setEditingId] = useState(null);

  function resetForm() {
    setName(""); setPropertyId(properties[0]?.id || ""); setLeaseStart(""); setLeaseEnd(""); setOngoing(true); setEditingId(null);
  }
  function startEdit(t) {
    setEditingId(t.id); setName(t.name); setPropertyId(t.propertyId);
    setLeaseStart(t.leaseStart || ""); setLeaseEnd(t.leaseEnd || ""); setOngoing(!t.leaseEnd);
  }
  async function submit(e) {
    e.preventDefault();
    if (!name.trim() || !propertyId || !leaseStart) return;
    const payload = { name: name.trim(), propertyId, leaseStart, leaseEnd: ongoing ? null : (leaseEnd || null) };
    if (editingId) await onUpdate(editingId, payload);
    else await onAdd(payload);
    resetForm();
  }
  function provisionsByYear(tenantId) {
    const map = {};
    for (const t of transactions) {
      if (t.categorie === CAT.PROVISIONS && t.tenantId === tenantId) {
        const y = t.date.slice(0, 4);
        map[y] = (map[y] || 0) + t.montant;
      }
    }
    return Object.entries(map).sort((a, b) => (a[0] < b[0] ? 1 : -1));
  }

  return (
    <Modal open={open} onClose={onClose} title="Locataires" wide>
      <form onSubmit={submit} className="mb-6 space-y-3">
        <div className="grid grid-cols-2 gap-3">
          <Field label="Nom du locataire">
            <input className={inputClasses} value={name} onChange={(e) => setName(e.target.value)} placeholder="Ex. M. Durand" />
          </Field>
          <Field label="Logement">
            <select className={inputClasses} value={propertyId} onChange={(e) => setPropertyId(e.target.value)}>
              {properties.length === 0 && <option value="">Ajoute un bien d'abord</option>}
              {properties.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          </Field>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Début du bail">
            <input type="date" className={inputClasses} value={leaseStart} onChange={(e) => setLeaseStart(e.target.value)} required />
          </Field>
          <Field label="Fin du bail">
            <input type="date" className={inputClasses} value={leaseEnd} disabled={ongoing} onChange={(e) => setLeaseEnd(e.target.value)} />
          </Field>
        </div>
        <label className="flex items-center gap-2 text-sm text-[#5B5849]">
          <input type="checkbox" checked={ongoing} onChange={(e) => setOngoing(e.target.checked)} />
          Bail en cours (pas de date de fin)
        </label>
        <div className="flex gap-2">
          <button type="submit" className="rounded-lg bg-[#20211D] px-4 py-2 text-sm font-medium text-[#F7F5EC] hover:bg-[#3A3B33]">{editingId ? "Enregistrer" : "Ajouter"}</button>
          {editingId && <button type="button" onClick={resetForm} className="rounded-lg border border-[#D6D2C0] px-4 py-2 text-sm text-[#5B5849]">Annuler</button>}
        </div>
      </form>

      <div className="space-y-2">
        {tenants.length === 0 && <p className="text-sm text-[#8A876F]">Aucun locataire enregistré pour l'instant.</p>}
        {tenants.map((t) => {
          const property = properties.find((p) => p.id === t.propertyId);
          const yearly = provisionsByYear(t.id);
          return (
            <div key={t.id} className="rounded-lg border border-[#DEDAC9] bg-white px-4 py-3">
              <div className="flex items-start justify-between gap-2">
                <div>
                  <div className="text-[#20211D]">{t.name}</div>
                  <div className="text-xs text-[#8A876F]">{property?.name || "—"} · bail du {formatDateForDisplay(t.leaseStart)}{t.leaseEnd ? ` au ${formatDateForDisplay(t.leaseEnd)}` : " (en cours)"}</div>
                </div>
                <div className="flex items-center gap-1">
                  <button onClick={() => startEdit(t)} className="rounded-md p-1.5 text-[#6B6858] hover:bg-[#EAE7D9]" aria-label="Modifier"><Pencil size={15} /></button>
                  <button onClick={() => onDelete(t.id)} className="rounded-md p-1.5 text-[#A2432A] hover:bg-[#F3E2DC]" aria-label="Supprimer"><Trash2 size={15} /></button>
                </div>
              </div>
              {yearly.length > 0 && (
                <div className="mt-2 flex flex-wrap gap-x-4 gap-y-1 border-t border-[#EFEDE0] pt-2 text-xs text-[#6B6858]">
                  {yearly.map(([year, total]) => <span key={year}>Provisions {year} : <span className="font-mono tabular-nums">{formatCurrency(total)}</span></span>)}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </Modal>
  );
}

/* ============================================================================
 * RÉGULARISATION DE CHARGES ANNUELLES
 * ==========================================================================*/
function ChargeRegulModal({ open, onClose, properties, tenants, transactions }) {
  const [propertyId, setPropertyId] = useState(properties[0]?.id || "");
  const [periodStart, setPeriodStart] = useState("");
  const [periodEnd, setPeriodEnd] = useState("");
  const [chargesReelles, setChargesReelles] = useState("");

  useEffect(() => {
    if (open && !propertyId && properties[0]) setPropertyId(properties[0].id);
  }, [open, properties]); // eslint-disable-line react-hooks/exhaustive-deps

  const num = (v) => Math.max(0, parseFloat(String(v).replace(",", ".")) || 0);

  const result = useMemo(() => {
    if (!propertyId || !periodStart || !periodEnd || periodEnd < periodStart) return null;
    const totalDays = daysBetweenInclusive(periodStart, periodEnd);
    const totalCharges = num(chargesReelles);
    const tenantsForProperty = tenants.filter((t) => t.propertyId === propertyId);
    const rows = [];
    for (const t of tenantsForProperty) {
      const tenantEnd = t.leaseEnd || periodEnd;
      const overlapStart = maxISO(t.leaseStart, periodStart);
      const overlapEnd = minISO(tenantEnd, periodEnd);
      if (overlapStart > overlapEnd) continue; // pas de présence sur la période
      const presenceDays = daysBetweenInclusive(overlapStart, overlapEnd);
      const quotePart = totalDays > 0 ? (totalCharges * presenceDays) / totalDays : 0;
      const provisionsPaid = transactions
        .filter((x) => x.tenantId === t.id && x.categorie === CAT.PROVISIONS && x.date >= periodStart && x.date <= periodEnd)
        .reduce((s, x) => s + x.montant, 0);
      const solde = provisionsPaid - quotePart;
      rows.push({ tenant: t, overlapStart, overlapEnd, presenceDays, quotePart, provisionsPaid, solde });
    }
    return { totalDays, totalCharges, rows };
  }, [propertyId, periodStart, periodEnd, chargesReelles, tenants, transactions]);

  return (
    <Modal open={open} onClose={onClose} title="Régularisation de charges annuelles" wide>
      <div className="mb-5 grid grid-cols-2 gap-3 sm:grid-cols-4">
        <div className="col-span-2 sm:col-span-1">
          <Field label="Bien">
            <select className={inputClasses} value={propertyId} onChange={(e) => setPropertyId(e.target.value)}>
              {properties.length === 0 && <option value="">Ajoute un bien d'abord</option>}
              {properties.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          </Field>
        </div>
        <Field label="Début de période">
          <input type="date" className={inputClasses} value={periodStart} onChange={(e) => setPeriodStart(e.target.value)} />
        </Field>
        <Field label="Fin de période">
          <input type="date" className={inputClasses} value={periodEnd} onChange={(e) => setPeriodEnd(e.target.value)} />
        </Field>
        <Field label="Charges réelles (€)">
          <input type="number" step="0.01" inputMode="decimal" className={inputClasses} value={chargesReelles} onChange={(e) => setChargesReelles(e.target.value)} placeholder="1200" />
        </Field>
      </div>

      {!result && (
        <p className="text-sm text-[#8A876F]">Renseigne le bien, la période et le montant des charges réelles pour calculer la régularisation.</p>
      )}

      {result && result.rows.length === 0 && (
        <p className="text-sm text-[#8A876F]">Aucun locataire présent sur cette période pour ce bien.</p>
      )}

      {result && result.rows.length > 0 && (
        <div className="space-y-3">
          <p className="text-xs text-[#8A876F]">Période : {result.totalDays} jour(s) · Charges réelles totales : {formatCurrency(result.totalCharges)}. La quote-part de chaque locataire est calculée au prorata de ses jours de présence sur la période.</p>
          {result.rows.map((r) => (
            <div key={r.tenant.id} className="rounded-lg border border-[#DEDAC9] bg-white px-4 py-3">
              <div className="flex items-center justify-between">
                <span className="text-[#20211D]">{r.tenant.name}</span>
                <span className="text-xs text-[#8A876F]">{formatDateForDisplay(r.overlapStart)} → {formatDateForDisplay(r.overlapEnd)} ({r.presenceDays} j.)</span>
              </div>
              <div className="mt-2 grid grid-cols-2 gap-2 text-sm sm:grid-cols-3">
                <div><span className="text-[#8A876F]">Quote-part réelle</span><div className="font-mono tabular-nums text-[#20211D]">{formatCurrency(r.quotePart)}</div></div>
                <div><span className="text-[#8A876F]">Provisions payées</span><div className="font-mono tabular-nums text-[#20211D]">{formatCurrency(r.provisionsPaid)}</div></div>
                <div>
                  <span className="text-[#8A876F]">{r.solde >= 0 ? "À rembourser au locataire" : "Complément à réclamer"}</span>
                  <div className={`font-mono tabular-nums ${r.solde >= 0 ? "text-[#3F6B4F]" : "text-[#A2432A]"}`}>{formatCurrency(Math.abs(r.solde))}</div>
                </div>
              </div>
            </div>
          ))}
        </div>
      )}
    </Modal>
  );
}

/* ============================================================================
 * FORMULAIRE DE SAISIE

const OPERATION_TABS = [
  { id: "LOYER", label: "Loyer reçu", icon: Home },
  { id: "EMPRUNT", label: "Mensualité d'emprunt", icon: Landmark },
  { id: "CHARGE", label: "Charge / Dépense", icon: Receipt },
];
function today() { return new Date().toISOString().slice(0, 10); }

function OperationFormModal({ open, onClose, properties, tenants, onSubmitGroup, editingGroup }) {
  const isEditing = editingGroup?.mode === "edit";
  const isDuplicating = editingGroup?.mode === "duplicate";
  const [tab, setTab] = useState("LOYER");
  const [date, setDate] = useState(today());
  const [propertyId, setPropertyId] = useState(properties[0]?.id || "");
  const [tenantId, setTenantId] = useState("");
  const [tenantTouched, setTenantTouched] = useState(false);
  const [loyerHC, setLoyerHC] = useState("");
  const [provisions, setProvisions] = useState("");
  const [capital, setCapital] = useState("");
  const [interets, setInterets] = useState("");
  const [assurance, setAssurance] = useState("");
  const [chargeCategorie, setChargeCategorie] = useState(CHARGE_CATEGORIES[0]);
  const [chargeMontant, setChargeMontant] = useState("");
  const [chargeLibelle, setChargeLibelle] = useState("");

  const tenantsForProperty = useMemo(() => tenants.filter((t) => t.propertyId === propertyId), [tenants, propertyId]);

  useEffect(() => {
    if (!open) return;
    if (editingGroup) {
      setTab(editingGroup.tab);
      setDate(editingGroup.date);
      setPropertyId(editingGroup.propertyId);
      setTenantId(editingGroup.tenantId || "");
      setTenantTouched(true);
      setLoyerHC(editingGroup.loyerHC ?? "");
      setProvisions(editingGroup.provisions ?? "");
      setCapital(editingGroup.capital ?? "");
      setInterets(editingGroup.interets ?? "");
      setAssurance(editingGroup.assurance ?? "");
      setChargeCategorie(editingGroup.chargeCategorie ?? CHARGE_CATEGORIES[0]);
      setChargeMontant(editingGroup.chargeMontant ?? "");
      setChargeLibelle(editingGroup.chargeLibelle ?? "");
    } else {
      setTab("LOYER");
      setDate(today());
      if (!propertyId && properties[0]) setPropertyId(properties[0].id);
      setTenantTouched(false);
      resetAll();
    }
  }, [open, editingGroup]); // eslint-disable-line react-hooks/exhaustive-deps

  // Initialise automatiquement le locataire dont le bail est en cours pour ce bien à cette date,
  // tant que l'utilisateur n'a pas choisi un autre locataire lui-même.
  useEffect(() => {
    if (!open || tab !== "LOYER" || tenantTouched) return;
    const active = findActiveTenant(tenants, propertyId, date);
    setTenantId(active ? active.id : "");
  }, [open, tab, propertyId, date, tenants, tenantTouched]);

  const num = (v) => Math.max(0, parseFloat(String(v).replace(",", ".")) || 0);
  const loyerTotal = num(loyerHC) + num(provisions);
  const mensualiteTotal = num(capital) + num(interets) + num(assurance);

  function resetAll() { setLoyerHC(""); setProvisions(""); setCapital(""); setInterets(""); setAssurance(""); setChargeMontant(""); setChargeLibelle(""); }

  async function submit(e) {
    e.preventDefault();
    if (!propertyId) return;
    const property = properties.find((p) => p.id === propertyId);
    const groupId = uid();
    const base = { date, propertyId, groupId };
    let rows = [];
    if (tab === "LOYER") {
      if (num(loyerHC) > 0) rows.push({ ...base, categorie: CAT.LOYER_HC, libelle: `Loyer ${property?.name || ""}`.trim(), montant: num(loyerHC), typeOperation: "Recette", tenantId: tenantId || null });
      if (num(provisions) > 0) rows.push({ ...base, categorie: CAT.PROVISIONS, libelle: `Provisions charges ${property?.name || ""}`.trim(), montant: num(provisions), typeOperation: "Recette", tenantId: tenantId || null });
    }
    if (tab === "EMPRUNT") {
      if (num(interets) > 0) rows.push({ ...base, categorie: CAT.INTERETS, libelle: `Intérêts emprunt ${property?.name || ""}`.trim(), montant: num(interets), typeOperation: "Depense" });
      if (num(assurance) > 0) rows.push({ ...base, categorie: CAT.ASSURANCE_EMPRUNT, libelle: `Assurance emprunteur ${property?.name || ""}`.trim(), montant: num(assurance), typeOperation: "Depense" });
      if (num(capital) > 0) rows.push({ ...base, categorie: CAT.CAPITAL, libelle: `Capital amorti ${property?.name || ""}`.trim(), montant: num(capital), typeOperation: "Depense" });
    }
    if (tab === "CHARGE") {
      if (num(chargeMontant) > 0) rows.push({ ...base, categorie: chargeCategorie, libelle: chargeLibelle.trim(), montant: num(chargeMontant), typeOperation: "Depense" });
    }
    if (rows.length === 0) return;
    await onSubmitGroup(rows, isEditing ? editingGroup.groupId : null);
    resetAll();
    onClose();
  }

  return (
    <Modal open={open} onClose={onClose} title={isEditing ? "Modifier l'opération" : isDuplicating ? "Dupliquer l'opération" : "Nouvelle opération"} wide>
      <div className="mb-5 flex gap-2 rounded-lg bg-[#EAE7D9] p-1">
        {OPERATION_TABS.map((t) => {
          const Icon = t.icon; const active = tab === t.id;
          return (
            <button key={t.id} onClick={() => setTab(t.id)}
              className={`flex flex-1 items-center justify-center gap-1.5 rounded-md px-3 py-2 text-sm transition-colors ${active ? "bg-white text-[#20211D] shadow-sm" : "text-[#6B6858] hover:text-[#20211D]"}`}>
              <Icon size={15} />{t.label}
            </button>
          );
        })}
      </div>
      <form onSubmit={submit} className="space-y-4">
        <div className="grid grid-cols-2 gap-3">
          <Field label={tab === "LOYER" ? "Date du virement" : tab === "EMPRUNT" ? "Date du prélèvement" : "Date"}>
            <input type="date" className={inputClasses} value={date} onChange={(e) => setDate(e.target.value)} required />
          </Field>
          <Field label="Propriété concernée">
            <select className={inputClasses} value={propertyId} onChange={(e) => setPropertyId(e.target.value)} required>
              {properties.length === 0 && <option value="">Ajoute un bien d'abord</option>}
              {properties.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          </Field>
        </div>

        {tab === "LOYER" && (
          <>
            <Field label="Locataire">
              <select className={inputClasses} value={tenantId} onChange={(e) => { setTenantId(e.target.value); setTenantTouched(true); }}>
                <option value="">Aucun / non renseigné</option>
                {tenantsForProperty.map((t) => <option key={t.id} value={t.id}>{t.name}{!t.leaseEnd ? " (bail en cours)" : ""}</option>)}
              </select>
            </Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Loyer Hors Charges (€)"><input type="number" step="0.01" inputMode="decimal" className={inputClasses} value={loyerHC} onChange={(e) => setLoyerHC(e.target.value)} placeholder="550" /></Field>
              <Field label="Provisions sur charges (€)"><input type="number" step="0.01" inputMode="decimal" className={inputClasses} value={provisions} onChange={(e) => setProvisions(e.target.value)} placeholder="50" /></Field>
            </div>
            <div className="flex items-center justify-between rounded-lg border border-[#DEDAC9] bg-white px-4 py-3">
              <span className="text-sm text-[#5B5849]">Total perçu</span>
              <span className="font-mono text-lg tabular-nums text-[#20211D]">{formatCurrency(loyerTotal)}</span>
            </div>
          </>
        )}

        {tab === "EMPRUNT" && (
          <>
            <div className="grid grid-cols-3 gap-3">
              <Field label="Capital amorti (€)"><input type="number" step="0.01" inputMode="decimal" className={inputClasses} value={capital} onChange={(e) => setCapital(e.target.value)} placeholder="320" /></Field>
              <Field label="Intérêts d'emprunt (€)"><input type="number" step="0.01" inputMode="decimal" className={inputClasses} value={interets} onChange={(e) => setInterets(e.target.value)} placeholder="180" /></Field>
              <Field label="Assurance emprunteur (€)"><input type="number" step="0.01" inputMode="decimal" className={inputClasses} value={assurance} onChange={(e) => setAssurance(e.target.value)} placeholder="25" /></Field>
            </div>
            <div className="flex items-center justify-between rounded-lg border border-[#DEDAC9] bg-white px-4 py-3">
              <span className="text-sm text-[#5B5849]">Mensualité totale</span>
              <span className="font-mono text-lg tabular-nums text-[#20211D]">{formatCurrency(mensualiteTotal)}</span>
            </div>
            <p className="text-xs text-[#8A876F]">Le capital amorti est suivi en trésorerie mais exclu des charges déductibles.</p>
          </>
        )}

        {tab === "CHARGE" && (
          <>
            <Field label="Catégorie fiscale">
              <select className={inputClasses} value={chargeCategorie} onChange={(e) => setChargeCategorie(e.target.value)}>
                {CHARGE_CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
              </select>
            </Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Montant (€)"><input type="number" step="0.01" inputMode="decimal" className={inputClasses} value={chargeMontant} onChange={(e) => setChargeMontant(e.target.value)} placeholder="120" /></Field>
              <Field label="Libellé (optionnel)"><input className={inputClasses} value={chargeLibelle} onChange={(e) => setChargeLibelle(e.target.value)} placeholder="Ex. Ravalement façade" /></Field>
            </div>
          </>
        )}

        <div className="flex justify-end gap-2 pt-2">
          <button type="button" onClick={onClose} className="rounded-lg border border-[#D6D2C0] px-4 py-2 text-sm text-[#5B5849]">Annuler</button>
          <button type="submit" disabled={!propertyId} className="rounded-lg bg-[#9A5B34] px-4 py-2 text-sm font-medium text-white hover:bg-[#84492A] disabled:opacity-40">{isEditing ? "Enregistrer les modifications" : "Enregistrer"}</button>
        </div>
      </form>
    </Modal>
  );
}

function RealEstateLedger({ onSignOut, showSignOut }) {
  const store = useLedgerStore();
  const { properties, tenants, transactions } = store;
  const [selectedPropertyId, setSelectedPropertyId] = useState("ALL");
  const [yearFilter, setYearFilter] = useState("ALL");
  const [categoryFilter, setCategoryFilter] = useState("ALL");
  const [viewMode, setViewMode] = useState("SIMPLE");
  const [formOpen, setFormOpen] = useState(false);
  const [editingGroup, setEditingGroup] = useState(null);
  const [propertiesOpen, setPropertiesOpen] = useState(false);
  const [tenantsOpen, setTenantsOpen] = useState(false);
  const [regulOpen, setRegulOpen] = useState(false);

  const propertiesById = useMemo(() => Object.fromEntries(properties.map((p) => [p.id, p])), [properties]);
  const tenantsById = useMemo(() => Object.fromEntries(tenants.map((t) => [t.id, t])), [tenants]);
  const years = useMemo(() => Array.from(new Set(transactions.map((t) => t.date.slice(0, 4)))).sort().reverse(), [transactions]);
  const allCategories = useMemo(() => Object.values(CAT), []);

  const filtered = useMemo(() => transactions
    .filter((t) => selectedPropertyId === "ALL" || t.propertyId === selectedPropertyId)
    .filter((t) => yearFilter === "ALL" || t.date.startsWith(yearFilter))
    .filter((t) => categoryFilter === "ALL" || t.categorie === categoryFilter)
    .sort((a, b) => (a.date < b.date ? 1 : -1)), [transactions, selectedPropertyId, yearFilter, categoryFilter]);

  const displayRows = useMemo(() => {
    if (viewMode === "DETAIL") {
      return filtered.map((t) => {
        const tenantName = t.tenantId ? tenantsById[t.tenantId]?.name : null;
        const subtitle = [t.libelle, tenantName].filter(Boolean).join(" • ");
        return {
          key: t.id, date: t.date, propertyId: t.propertyId, montant: t.montant,
          isRecette: t.typeOperation === "Recette", title: t.categorie, subtitle, representative: t,
        };
      });
    }
    const groups = {};
    for (const t of filtered) {
      const key = t.groupId || t.id;
      (groups[key] = groups[key] || []).push(t);
    }
    return Object.values(groups).map((rows) => {
      const first = rows[0];
      const tab = detectGroupTab(rows);
      const montant = rows.reduce((sum, r) => sum + r.montant, 0);
      const isRecette = rows.every((r) => r.typeOperation === "Recette");
      const title = tab === "LOYER" ? `Loyer ${monthLabel(first.date)}`
        : tab === "EMPRUNT" ? `Mensualité ${monthLabel(first.date)}`
        : first.categorie;
      const subtitle = tab === "CHARGE" ? (first.libelle || "") : tab === "LOYER" ? (tenantsById[first.tenantId]?.name || "") : "";
      return { key: first.groupId || first.id, date: first.date, propertyId: first.propertyId, montant, isRecette, title, subtitle, representative: first };
    }).sort((a, b) => (a.date < b.date ? 1 : -1));
  }, [filtered, viewMode, tenantsById]);

  const kpis = useMemo(() => {
    let totalLoyers = 0, totalCharges = 0, net = 0;
    for (const t of filtered) {
      const signed = t.typeOperation === "Recette" ? t.montant : -t.montant;
      net += signed;
      if (t.typeOperation === "Recette") totalLoyers += t.montant;
      else if (!NON_DEDUCTIBLE.has(t.categorie)) totalCharges += t.montant;
    }
    return { totalLoyers, totalCharges, net };
  }, [filtered]);

  async function handleSubmitGroup(rows, oldGroupId) {
    if (oldGroupId) await store.deleteTransactionGroup(oldGroupId);
    await store.addTransactions(rows);
  }
  function openNewForm() { setEditingGroup(null); setFormOpen(true); }

  function buildGroupValues(t) {
    const group = t.groupId ? transactions.filter((x) => x.groupId === t.groupId) : [t];
    const amountFor = (cat) => group.find((x) => x.categorie === cat)?.montant ?? "";
    const tab = detectGroupTab(group);
    if (tab === "LOYER") return { tab, loyerHC: amountFor(CAT.LOYER_HC), provisions: amountFor(CAT.PROVISIONS), tenantId: group[0]?.tenantId || "" };
    if (tab === "EMPRUNT") return { tab, capital: amountFor(CAT.CAPITAL), interets: amountFor(CAT.INTERETS), assurance: amountFor(CAT.ASSURANCE_EMPRUNT) };
    return { tab, chargeCategorie: t.categorie, chargeMontant: t.montant, chargeLibelle: t.libelle || "" };
  }
  function handleEditRow(t) {
    setEditingGroup({ mode: "edit", groupId: t.groupId || t.id, date: t.date, propertyId: t.propertyId, ...buildGroupValues(t) });
    setFormOpen(true);
  }
  function handleDuplicateRow(t) {
    setEditingGroup({ mode: "duplicate", date: today(), propertyId: t.propertyId, ...buildGroupValues(t) });
    setFormOpen(true);
  }
  async function handleDeleteRow(t) {
    if (t.groupId) {
      const sameGroup = transactions.filter((x) => x.groupId === t.groupId);
      if (sameGroup.length > 1) {
        const ok = window.confirm("Cette ligne fait partie d'une saisie groupée. Supprimer toutes les lignes liées ?");
        if (ok) { await store.deleteTransactionGroup(t.groupId); return; }
      }
    }
    await store.deleteTransaction(t.id);
  }
  function handleExport() {
    const csv = buildCSV(filtered, propertiesById);
    const suffix = yearFilter === "ALL" ? "toutes-annees" : yearFilter;
    downloadCSV(csv, `registre-locatif-${suffix}.csv`);
  }

  return (
    <div className="min-h-screen bg-[#EDEBDF] text-[#20211D]">
      <div className="mx-auto max-w-6xl px-4 py-8">
        <div className="mb-6 flex flex-wrap items-center justify-between gap-3">
          <div>
            <h1 className="text-2xl font-semibold tracking-tight text-[#20211D]">Registre locatif</h1>
            <p className="text-sm text-[#6B6858]">Saisie des loyers, emprunts et charges — export prêt pour Qlower.</p>
          </div>
          <div className="flex items-center gap-2">
            <button onClick={() => setPropertiesOpen(true)} className="flex items-center gap-1.5 rounded-lg border border-[#D6D2C0] bg-white px-3 py-2 text-sm text-[#5B5849] hover:bg-[#F7F5EC]"><Settings size={15} />Mes biens</button>
            <button onClick={() => setTenantsOpen(true)} className="flex items-center gap-1.5 rounded-lg border border-[#D6D2C0] bg-white px-3 py-2 text-sm text-[#5B5849] hover:bg-[#F7F5EC]"><Users size={15} />Locataires</button>
            <button onClick={() => setRegulOpen(true)} className="flex items-center gap-1.5 rounded-lg border border-[#D6D2C0] bg-white px-3 py-2 text-sm text-[#5B5849] hover:bg-[#F7F5EC]"><Calculator size={15} />Régul. charges</button>
            <button onClick={handleExport} className="flex items-center gap-1.5 rounded-lg border border-[#20211D] bg-[#20211D] px-3 py-2 text-sm font-medium text-[#F7F5EC] hover:bg-[#3A3B33]"><Download size={15} />Exporter en CSV</button>
            {showSignOut && <button onClick={onSignOut} className="flex items-center gap-1.5 rounded-lg border border-[#D6D2C0] bg-white px-3 py-2 text-sm text-[#5B5849] hover:bg-[#F7F5EC]" aria-label="Se déconnecter"><LogOut size={15} /></button>}
          </div>
        </div>

        <div className="mb-4 flex flex-wrap items-center gap-2 rounded-xl border border-[#DEDAC9] bg-white/70 px-4 py-3">
          <span className="text-sm font-medium text-[#5B5849]">Année</span>
          <button onClick={() => setYearFilter("ALL")} className={`rounded-full px-3.5 py-1.5 text-sm ring-1 transition-colors ${yearFilter === "ALL" ? "bg-[#20211D] text-[#F7F5EC] ring-[#20211D]" : "bg-white text-[#5B5849] ring-[#D6D2C0] hover:bg-[#F7F5EC]"}`}>Toutes</button>
          {years.map((y) => (
            <button key={y} onClick={() => setYearFilter(y)} className={`rounded-full px-3.5 py-1.5 text-sm ring-1 transition-colors ${yearFilter === y ? "bg-[#20211D] text-[#F7F5EC] ring-[#20211D]" : "bg-white text-[#5B5849] ring-[#D6D2C0] hover:bg-[#F7F5EC]"}`}>{y}</button>
          ))}
        </div>

        <div className="mb-5 flex flex-wrap gap-2">
          <button onClick={() => setSelectedPropertyId("ALL")} className={`rounded-full px-3.5 py-1.5 text-sm ring-1 transition-colors ${selectedPropertyId === "ALL" ? "bg-[#20211D] text-[#F7F5EC] ring-[#20211D]" : "bg-white text-[#5B5849] ring-[#D6D2C0] hover:bg-[#F7F5EC]"}`}>Toutes mes propriétés</button>
          {properties.map((p) => {
            const accent = REGIME_ACCENT[p.regime]; const active = selectedPropertyId === p.id;
            return (
              <button key={p.id} onClick={() => setSelectedPropertyId(p.id)} className={`flex items-center gap-1.5 rounded-full px-3.5 py-1.5 text-sm ring-1 transition-colors ${active ? "bg-[#20211D] text-[#F7F5EC] ring-[#20211D]" : "bg-white text-[#5B5849] ring-[#D6D2C0] hover:bg-[#F7F5EC]"}`}>
                <Building2 size={13} className={active ? "text-[#F7F5EC]" : accent.text} />{p.name}
              </button>
            );
          })}
        </div>

        <div className="mb-6 flex flex-wrap gap-3">
          <KPICard label="Total loyers enregistrés" value={kpis.totalLoyers} tone="positive" icon={ArrowUpRight} />
          <KPICard label="Total charges déductibles" value={kpis.totalCharges} tone="negative" icon={ArrowDownRight} />
          <KPICard label="Net de trésorerie" value={kpis.net} tone={kpis.net >= 0 ? "positive" : "negative"} icon={Wallet} />
        </div>

        <div className="mb-3 flex flex-wrap items-center justify-between gap-3">
          <button onClick={openNewForm} disabled={properties.length === 0} className="flex items-center gap-1.5 rounded-lg bg-[#9A5B34] px-4 py-2.5 text-sm font-medium text-white hover:bg-[#84492A] disabled:opacity-40"><Plus size={16} />Nouvelle opération</button>
          <div className="flex flex-wrap gap-2">
            <div className="flex rounded-lg bg-[#EAE7D9] p-1 text-sm">
              <button onClick={() => setViewMode("SIMPLE")} className={`rounded-md px-3 py-1.5 transition-colors ${viewMode === "SIMPLE" ? "bg-white text-[#20211D] shadow-sm" : "text-[#6B6858]"}`}>Simplifiée</button>
              <button onClick={() => setViewMode("DETAIL")} className={`rounded-md px-3 py-1.5 transition-colors ${viewMode === "DETAIL" ? "bg-white text-[#20211D] shadow-sm" : "text-[#6B6858]"}`}>Détaillée</button>
            </div>
            <select className="rounded-lg border border-[#D6D2C0] bg-white px-3 py-2 text-sm text-[#5B5849]" value={categoryFilter} onChange={(e) => setCategoryFilter(e.target.value)}>
              <option value="ALL">Toutes les catégories</option>
              {allCategories.map((c) => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>
        </div>

        {properties.length === 0 && (
          <div className="mb-4 rounded-lg border border-[#DEDAC9] bg-white px-4 py-3 text-sm text-[#6B6858]">Ajoute un premier bien dans « Mes biens » pour commencer à saisir des opérations.</div>
        )}

        {/* Vue mobile : cartes empilées */}
        <div className="space-y-2 sm:hidden">
          {displayRows.length === 0 && (
            <div className="rounded-xl border border-[#DEDAC9] bg-white px-4 py-10 text-center text-[#8A876F]">Aucune opération pour ces filtres.</div>
          )}
          {displayRows.map((row) => {
            const property = propertiesById[row.propertyId];
            return (
              <div key={row.key} className="rounded-xl border border-[#DEDAC9] bg-white px-4 py-3">
                <div className="flex items-start justify-between gap-2">
                  <div>
                    <div className="text-sm text-[#20211D]">{property?.name || "—"}</div>
                    <div className="text-xs text-[#8A876F]">{formatDateForDisplay(row.date)}</div>
                  </div>
                  <div className={`whitespace-nowrap font-mono text-base tabular-nums ${row.isRecette ? "text-[#3F6B4F]" : "text-[#A2432A]"}`}>
                    {row.isRecette ? "+" : "−"} {formatCurrency(row.montant)}
                  </div>
                </div>
                <div className="mt-1 text-sm text-[#5B5849]">{row.title}</div>
                {row.subtitle && <div className="text-xs text-[#8A876F]">{row.subtitle}</div>}
                <div className="mt-2 flex justify-end gap-1">
                  <button onClick={() => handleDuplicateRow(row.representative)} className="rounded-md p-1.5 text-[#6B6858] hover:bg-[#EAE7D9]" aria-label="Dupliquer"><Copy size={15} /></button>
                  <button onClick={() => handleEditRow(row.representative)} className="rounded-md p-1.5 text-[#6B6858] hover:bg-[#EAE7D9]" aria-label="Modifier"><Pencil size={15} /></button>
                  <button onClick={() => handleDeleteRow(row.representative)} className="rounded-md p-1.5 text-[#A2432A] hover:bg-[#F3E2DC]" aria-label="Supprimer"><Trash2 size={15} /></button>
                </div>
              </div>
            );
          })}
        </div>

        {/* Vue bureau : tableau */}
        <div className="hidden overflow-x-auto rounded-xl border border-[#DEDAC9] bg-white sm:block">
          <table className="w-full text-sm">
            <thead>
              <tr className="border-b border-[#DEDAC9] bg-[#F7F5EC] text-left text-[#6B6858]">
                <th className="px-4 py-3 font-medium">Date</th>
                <th className="px-4 py-3 font-medium">Bien</th>
                <th className="px-4 py-3 font-medium">Catégorie fiscale</th>
                <th className="px-4 py-3 font-medium">Libellé</th>
                <th className="px-4 py-3 text-right font-medium">Montant</th>
                <th className="px-4 py-3 text-right font-medium">Actions</th>
              </tr>
            </thead>
            <tbody>
              {displayRows.length === 0 && <tr><td colSpan={6} className="px-4 py-10 text-center text-[#8A876F]">Aucune opération pour ces filtres.</td></tr>}
              {displayRows.map((row) => {
                const property = propertiesById[row.propertyId];
                return (
                  <tr key={row.key} className="border-b border-[#EFEDE0] last:border-0 hover:bg-[#FAF9F2]">
                    <td className="whitespace-nowrap px-4 py-3 text-[#20211D]">{formatDateForDisplay(row.date)}</td>
                    <td className="px-4 py-3 text-[#20211D]">{property?.name || "—"}</td>
                    <td className="px-4 py-3 text-[#5B5849]">{row.title}</td>
                    <td className="px-4 py-3 text-[#5B5849]">{row.subtitle || "—"}</td>
                    <td className={`whitespace-nowrap px-4 py-3 text-right font-mono tabular-nums ${row.isRecette ? "text-[#3F6B4F]" : "text-[#A2432A]"}`}>{row.isRecette ? "+" : "−"} {formatCurrency(row.montant)}</td>
                    <td className="px-4 py-3 text-right">
                      <div className="flex justify-end gap-1">
                        <button onClick={() => handleDuplicateRow(row.representative)} className="rounded-md p-1.5 text-[#6B6858] hover:bg-[#EAE7D9]" aria-label="Dupliquer"><Copy size={15} /></button>
                        <button onClick={() => handleEditRow(row.representative)} className="rounded-md p-1.5 text-[#6B6858] hover:bg-[#EAE7D9]" aria-label="Modifier"><Pencil size={15} /></button>
                        <button onClick={() => handleDeleteRow(row.representative)} className="rounded-md p-1.5 text-[#A2432A] hover:bg-[#F3E2DC]" aria-label="Supprimer"><Trash2 size={15} /></button>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>

        {!FIREBASE_ENABLED && <p className="mt-4 text-xs text-[#8A876F]">Mode local : les données sont stockées dans ce navigateur (localStorage). Renseigne FIREBASE_CONFIG en haut du fichier pour passer sur Firestore.</p>}
      </div>

      <PropertyManagerModal open={propertiesOpen} onClose={() => setPropertiesOpen(false)} properties={properties} onAdd={store.addProperty} onUpdate={store.updateProperty} onDelete={store.deleteProperty} />
      <TenantManagerModal
        open={tenantsOpen}
        onClose={() => setTenantsOpen(false)}
        tenants={tenants}
        properties={properties}
        transactions={transactions}
        onAdd={store.addTenant}
        onUpdate={store.updateTenant}
        onDelete={store.deleteTenant}
      />
      <ChargeRegulModal
        open={regulOpen}
        onClose={() => setRegulOpen(false)}
        properties={properties}
        tenants={tenants}
        transactions={transactions}
      />
      <OperationFormModal
        open={formOpen}
        onClose={() => { setFormOpen(false); setEditingGroup(null); }}
        properties={properties}
        tenants={tenants}
        onSubmitGroup={handleSubmitGroup}
        editingGroup={editingGroup}
      />
    </div>
  );
}

/* ============================================================================
 * ÉCRAN DE CONNEXION
 * ==========================================================================*/
function GoogleG({ size = 18 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 48 48">
      <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
      <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
      <path fill="#4CAF50" d="M24 44c5.5 0 10.4-2.1 14.1-5.5l-6.5-5.5c-2 1.5-4.6 2.4-7.6 2.4-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.6 39.6 16.3 44 24 44z"/>
      <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.5 5.5C41.3 36.5 44 30.9 44 24c0-1.3-.1-2.7-.4-3.5z"/>
    </svg>
  );
}

function LoginScreen() {
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  async function handleGoogleSignIn() {
    setError(""); setLoading(true);
    try {
      const api = await getAuthApi();
      await api.signInWithPopup(api.auth, new api.GoogleAuthProvider());
    } catch (err) {
      setError("Erreur : " + (err?.message || err));
    } finally {
      setLoading(false);
    }
  }

  return (
    <div className="flex min-h-screen items-center justify-center bg-[#EDEBDF] px-4">
      <div className="w-full max-w-sm rounded-2xl border border-[#DEDAC9] bg-white p-7 text-center">
        <div className="mb-5 flex items-center justify-center gap-2 text-[#20211D]"><Lock size={18} /><h1 className="text-lg font-semibold">Registre locatif</h1></div>
        <p className="mb-5 text-sm text-[#6B6858]">Connexion requise pour accéder à tes données.</p>
        {error && <p className="mb-3 text-sm text-[#A2432A]">{error}</p>}
        <button onClick={handleGoogleSignIn} disabled={loading}
          className="flex w-full items-center justify-center gap-2 rounded-lg border border-[#D6D2C0] bg-white px-4 py-2.5 text-sm font-medium text-[#20211D] hover:bg-[#F7F5EC] disabled:opacity-40">
          <GoogleG size={18} />{loading ? "Connexion…" : "Se connecter avec Google"}
        </button>
      </div>
    </div>
  );
}

/* ============================================================================
 * RACINE
 * ==========================================================================*/
function App() {
  const [authChecked, setAuthChecked] = useState(!FIREBASE_ENABLED);
  const [user, setUser] = useState(null);

  useEffect(() => {
    if (!FIREBASE_ENABLED) return;
    let unsub = () => {};
    (async () => {
      const api = await getAuthApi();
      unsub = api.onAuthStateChanged(api.auth, (u) => { setUser(u); setAuthChecked(true); });
    })();
    return () => unsub();
  }, []);

  async function handleSignOut() { const api = await getAuthApi(); await api.signOut(api.auth); }

  if (!authChecked) return <div className="flex min-h-screen items-center justify-center bg-[#EDEBDF] text-[#6B6858]">Chargement…</div>;
  if (FIREBASE_ENABLED && !user) return <LoginScreen />;
  return <RealEstateLedger onSignOut={handleSignOut} showSignOut={FIREBASE_ENABLED} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
